name: ImmortalWrt-25.12-Lucky-SDK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      SDK_URL: https://downloads.immortalwrt.org/releases/25.12.0-rc2/targets/x86/64/immortalwrt-sdk-25.12.0-rc2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
      SDK_NAME: immortalwrt-sdk-25.12.0-rc2-x86-64_gcc-14.3.0_musl.Linux-x86_64

    steps:
      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget curl zstd

      - name: 下载并解压 ImmortalWrt SDK
        run: |
          wget -q "$SDK_URL"
          tar --zstd -xvf "$SDK_NAME.tar.zst"
          mv "$SDK_NAME" openwrt-sdk

      - name: 添加 Lucky 源码
        run: |
          git clone https://github.com/gdy666/luci-app-lucky.git \
            openwrt-sdk/package/lucky

      - name: 生成默认配置
        run: |
          cd openwrt-sdk
          cat >.config <<EOF
CONFIG_TARGET_x86=y
CONFIG_TARGET_x86_64=y
CONFIG_PACKAGE_lucky=y
CONFIG_PACKAGE_luci-app-lucky=y
CONFIG_PACKAGE_luci-i18n-lucky-zh-cn=y
EOF
          make defconfig

      - name: 编译 Lucky & LuCI
        run: |
          cd openwrt-sdk
          make package/lucky/lucky/compile -j$(nproc) V=s
          make package/lucky/luci-app-lucky/compile -j$(nproc) V=s

      - name: 列出生成的 IPK
        run: |
          find openwrt-sdk/bin -name "*.ipk"

      - name: 上传 IPK 产物
        uses: actions/upload-artifact@v4
        with:
          name: lucky-ipk-x86_64
          path: |
            openwrt-sdk/bin/packages/**/*.ipk

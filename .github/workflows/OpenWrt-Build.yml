name: ImmortalWrt-25.12-Lucky-APK-Release

on:
  workflow_dispatch:

permissions:
  contents: write   # 允许创建 Tag 和 Release

env:
  SDK_URL: https://downloads.immortalwrt.org/releases/25.12.0-rc2/targets/x86/64/immortalwrt-sdk-25.12.0-rc2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  SDK_DIR: immortalwrt-sdk-25.12.0-rc2-x86-64_gcc-14.3.0_musl.Linux-x86_64

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout（用于 git 操作）
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget curl zstd

      - name: 下载 & 解压 SDK
        run: |
          wget -q "$SDK_URL" -O sdk.tar.zst
          tar --zstd -xvf sdk.tar.zst
          mv "$SDK_DIR" openwrt-sdk
      - name: 更新 Feeds 并安装依赖
        run: |
          cd openwrt-sdk
          # 这一步非常关键！缺失会导致找不到 luci.mk
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      - name: 添加 luci-app-lucky
        run: |
          git clone --depth=1 https://github.com/gdy666/luci-app-lucky.git \
            openwrt-sdk/package/lucky

      - name: 配置 SDK
        run: |
          cd openwrt-sdk
          cat >.config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_PACKAGE_lucky=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_luci-i18n-lucky-zh-cn=y
          EOF
          make defconfig

      - name: 编译 IPK
        run: |
          cd openwrt-sdk
          make package/lucky/lucky/compile -j$(nproc) V=s
          make package/lucky/luci-app-lucky/compile -j$(nproc) V=s

      - name: 安装 apk-tools (v3)
        run: |
          sudo apt-get install -y apk-tools

      - name: IPK → APK
        run: |
          mkdir -p /tmp/apk_out
          find openwrt-sdk/bin -name "*.ipk" | while read ipk; do
            TMP=$(mktemp -d)
            cd "$TMP"
            ar x "$ipk"
            [ -f data.tar.gz ] && tar xzf data.tar.gz
            [ -f data.tar.xz ] && tar xJf data.tar.xz
            [ -f data.tar.zst ] && unzstd -c data.tar.zst | tar xf -
            PKGNAME=$(basename "$ipk" | sed 's/_.*//')
            VERSION=$(basename "$ipk" | grep -oP '(?<=_)[0-9].*(?=\.ipk)')
            apk mkpkg \
              --info name="$PKGNAME" \
              --info version="$VERSION" \
              -d . \
              -o "/tmp/apk_out/$(basename "$ipk" .ipk).apk"
            cd /
            rm -rf "$TMP"
          done

      - name: 生成 Tag & Release
        id: release
        run: |
          TAG="lucky-25.12-$(date +'%Y%m%d-%H%M%S')"
          echo "TAG=$TAG" >> $GITHUB_ENV
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: 发布 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Lucky APK for ImmortalWrt 25.12
          body: |
            ✅ 自动构建 Lucky + LuCI
            📦 适用于 ImmortalWrt 25.12 (APKv3)
            🛠 x86_64 / GCC 14.3 / musl
          files: /tmp/apk_out/*.apk

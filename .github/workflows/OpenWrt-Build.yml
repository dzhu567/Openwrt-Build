name: ImmortalWrt-25.12-Lucky-SDK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装依赖
        run: |
          sudo apt update && sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl tar

      - name: 下载 OpenWrt SDK（25.12 x86_64）
        run: |
          # 下载对应架构的 SDK（这里以 x86_64 为例）
          git clone https://downloads.immortalwrt.org/releases/25.12.0-rc2/targets/x86/64/immortalwrt-sdk-25.12.0-rc2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          tar -xJf shturl.cc/pKKmcTBN
          mv openwrt-sdk-* openwrt-sdk
          cd openwrt-sdk

      - name: 添加 Lucky 源码（按官方方法）
        run: |
          cd openwrt-sdk
          git clone https://github.com/gdy666/luci-app-lucky package/lucky

      - name: 配置编译选项
        run: |
          cd openwrt-sdk
          cat > .config << EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_PACKAGE_luci-app-lucky=y
          EOF
          make defconfig

      - name: 编译 Lucky IPK 包
        run: |
          cd openwrt-sdk
          # 编译主程序和 LuCI 面板
          make package/lucky/lucky/compile -j$(nproc) V=s
          make package/lucky/luci-app-lucky/compile -j$(nproc) V=s

      - name: IPK 转 APK（适配 25.12）
        run: |
          cd openwrt-sdk/bin/packages/x86_64/
          for ipk in $(find . -name "lucky*.ipk" -o -name "luci*.ipk"); do
            mkdir -p /tmp/conv && cd /tmp/conv
            tar -xzf $OLDPWD/$ipk
            tar -xzf ./shturl.cc/8 -C ./
            tar -czf $OLDPWD/${ipk%.ipk}.apk .
            cd .. && rm -rf /tmp/conv
          done
          ls -l *.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: lucky-apk-from-sdk
          path: openwrt-sdk/bin/packages/x86_64/*.apk

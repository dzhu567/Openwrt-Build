name: ImmortalWrt-25.12-Lucky-APK

on:
  workflow_dispatch:

env:
  SDK_URL: https://downloads.immortalwrt.org/releases/25.12.0-rc2/targets/x86/64/immortalwrt-sdk-25.12.0-rc2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  SDK_DIR: immortalwrt-sdk-25.12.0-rc2-x86-64_gcc-14.3.0_musl.Linux-x86_64

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget curl zstd

      - name: 下载 & 解压 SDK
        run: |
          wget -q "$SDK_URL" -O sdk.tar.zst
          tar --zstd -xvf sdk.tar.zst
          mv "$SDK_DIR" openwrt-sdk

      - name: 添加 luci-app-lucky
        run: |
          git clone --depth=1 https://github.com/gdy666/luci-app-lucky.git \
            openwrt-sdk/package/lucky

      - name: 配置 SDK
        run: |
          cd openwrt-sdk
          cat >.config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_PACKAGE_lucky=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_luci-i18n-lucky-zh-cn=y
          EOF
          make defconfig

      - name: 编译 IPK
        run: |
          cd openwrt-sdk
          make package/lucky/lucky/compile -j$(nproc) V=s
          make package/lucky/luci-app-lucky/compile -j$(nproc) V=s

      - name: 安装 apk-tools (v3) 用于 mkpkg
        run: |
          # Ubuntu 22.04 自带 apk-tools 通常偏旧，用静态版或 apt 新版
          sudo apt-get install -y apk-tools

      - name: IPK → APK (OpenWrt 25.12 APKv3)
        run: |
          mkdir -p /tmp/apk_out
          find openwrt-sdk/bin -name "*.ipk" | while read ipk; do
            TMP=$(mktemp -d)
            cd "$TMP"
            # ipk = ar archive
            ar x "$ipk"
            # 解 data.tar.* 和 control.tar.*
            [ -f data.tar.gz ] && tar xzf data.tar.gz
            [ -f data.tar.xz ] && tar xJf data.tar.xz
            [ -f data.tar.zst ] && unzstd -c data.tar.zst | tar xf -
            [ -f control.tar.gz ] && tar xzf control.tar.gz
            PKGNAME=$(basename "$ipk" | sed 's/_.*//')

            # 用 apk mkpkg 生成 APKv3（无签名，安装用 --allow-untrusted）
            apk mkpkg \
              --info name="$PKGNAME" \
              --info version="$(basename "$ipk" | grep -oP '(?<=\_)[0-9].*(?=\.ipk)')" \
              -d . \
              -o "/tmp/apk_out/$(basename "$ipk" .ipk).apk"
            cd /
            rm -rf "$TMP"
          done
          ls -lh /tmp/apk_out/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: lucky-apk-immortalwrt-25.12
          path: /tmp/apk_out/*.apk

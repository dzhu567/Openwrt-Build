name: Build Lucky APK & Upload to Tag
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl tar

      - name: Clone ImmortalWrt 25.12 source
        run: |
          git clone --depth 1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add luci-app-lucky
        run: |
          cd immortalwrt/package
          mkdir -p lean
          cd lean
          git clone https://github.com/gdy666/luci-app-lucky.git lucky
          cd ../../

      - name: Configure build
        run: |
          cd immortalwrt
          cat > .config <<EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_PACKAGE_lucky=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_luci-i18n-lucky-zh-cn=y
          EOF
          make defconfig

      - name: Compile packages
        run: |
          cd immortalwrt
          make package/lucky/lucky/compile -j$(nproc) V=s
          make package/lucky/luci-app-lucky/compile -j$(nproc) V=s

      - name: Convert IPK to APK
        run: |
          cd immortalwrt/bin/packages/x86_64
          mkdir -p apks
          for ipk in *.ipk; do
            mkdir -p tmp && cd tmp
            tar -xf ../$ipk
            tar -xf data.tar.gz
            tar -czf ../apks/${ipk%.ipk}.apk .
            cd ..
            rm -rf tmp
          done

      - name: Upload APK to Tag (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.19.5"
          files: immortalwrt/bin/packages/x86_64/apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

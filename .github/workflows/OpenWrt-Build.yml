name: OpenWrt x86 Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get latest OpenWrt tag
        id: get_latest_tag
        run: |
          TAG=$(curl -s "https://api.github.com/repos/openwrt/openwrt/tags" | jq -r '.[0].name')
          echo "latest_tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $TAG"

      - name: Check previous build
        id: check_build
        run: |
          if [ -f last_build.txt ]; then
            OLD_TAG=$(cat last_build.txt)
            echo "old_tag=$OLD_TAG" >> $GITHUB_OUTPUT
            if [ "$OLD_TAG" = "${{ steps.get_latest_tag.outputs.latest_tag }}" ]; then
              echo "build_needed=no" >> $GITHUB_OUTPUT
            else
              echo "build_needed=yes" >> $GITHUB_OUTPUT
            fi
          else
            echo "build_needed=yes" >> $GITHUB_OUTPUT
            echo "old_tag=none" >> $GITHUB_OUTPUT
          fi

      - name: Build skipped notice
        if: steps.check_build.outputs.build_needed == 'no'
        run: |
          echo "Build skipped: ${{ steps.get_latest_tag.outputs.latest_tag }} already built."
          echo "Previous build: ${{ steps.check_build.outputs.old_tag }}"

      - name: Install build dependencies
        if: steps.check_build.outputs.build_needed == 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-pyelftools rsync unzip wget zlib1g-dev

      - name: Clone OpenWrt
        if: steps.check_build.outputs.build_needed == 'yes'
        run: |
          TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
          git clone --depth=1 --branch "$TAG" https://github.com/openwrt/openwrt.git openwrt
          echo "Cloned OpenWrt $TAG"

      - name: Prepare build
        if: steps.check_build.outputs.build_needed == 'yes'
        working-directory: ./openwrt
        run: |
          make defconfig
          echo "Configuration complete"

      - name: Download sources
        if: steps.check_build.outputs.build_needed == 'yes'
        working-directory: ./openwrt
        run: |
          make download -j$(nproc) || make download -j1
          echo "Sources downloaded"

      - name: Build firmware
        if: steps.check_build.outputs.build_needed == 'yes'
        working-directory: ./openwrt
        run: |
          echo "Starting build..."
          make -j$(nproc) || make -j1 V=s
          echo "Build complete"

      - name: Show artifacts
        if: steps.check_build.outputs.build_needed == 'yes'
        working-directory: ./openwrt
        run: |
          echo "Build artifacts:"
          find bin/targets/x86/64 -name "*.img.gz" 2>/dev/null | xargs -r ls -lh || echo "No images found"

      - name: Save build info
        if: steps.check_build.outputs.build_needed == 'yes'
        run: |
          echo "${{ steps.get_latest_tag.outputs.latest_tag }}" > last_build.txt
          echo "Saved build info: ${{ steps.get_latest_tag.outputs.latest_tag }}"

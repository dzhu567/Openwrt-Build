name: Build Lucky APK (SDK 版，无工具链错误)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 安装基础依赖（含 zstd 解压支持）
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl tar \
          zstd  # 关键：25.12 SDK 多为 .tar.zst 格式，必须安装 zstd

      - name: 2. 下载 ImmortalWrt 25.12 x86_64 SDK（使用 GitHub 镜像源）
        run: |
          echo "正在下载 SDK..."
          # 使用 GitHub Releases 镜像源（更稳定）
          wget -O openwrt-sdk.tar.zst https://github.com/immortalwrt/immortalwrt/releases/download/25.12-SNAPSHOT/immortalwrt-sdk-x86-64_gcc-14.3.0-musl.Linux-x86_64.tar.zst
          
          # 解压 .zst 文件
          tar --zstd -xf openwrt-sdk.tar.zst
          
          # 重命名为 sdk 目录
          mv immortalwrt-sdk-* sdk
          ls -l sdk  # 检查是否解压成功
          cd sdk

      - name: 3. 添加 Lucky 源码（官方路径）
        run: |
          cd sdk
          # 确保 package 目录存在
          mkdir -p package
          # 克隆源码
          git clone https://github.com/gdy666/luci-app-lucky.git package/lucky

      - name: 4. 配置编译选项
        run: |
          cd sdk
          # 生成默认配置
          make defconfig
          
          # 手动启用 Lucky 组件
          # 注意：这里假设你只需要 lucky 和 luci-app-lucky，如果需要其他依赖请自行添加
          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_PACKAGE_lucky=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-lucky=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-lucky-zh-cn=y" >> .config
          
          # 再次确认配置
          make defconfig

      - name: 5. 编译 Lucky
        run: |
          cd sdk
          # 使用多线程编译，-j$(nproc) 自动根据 CPU 核心数调整
          make package/lucky/compile -j$(nproc) V=s

      - name: 6. IPK → APK 转换（仅用 tar）
        run: |
          cd sdk/bin/packages/x86_64
          mkdir -p apk_out
          
          # 遍历所有 .ipk 文件
          for ipk in *.ipk; do
            if [ -f "$ipk" ]; then
              echo "正在处理: $ipk"
              mkdir -p tmp && cd tmp
              
              # 解压 ipk (ipk 本质是 tar.gz)
              tar -xzf ../"$ipk"
              
              # 解压 data.tar.gz
              tar -xzf ./data.tar.gz -C ./
              
              # 重新打包为 .apk (这里只是改名，实际不是标准 APK)
              # 如果你需要真正的 APK，可能需要更复杂的工具链，但在 OpenWrt 环境下，这通常是为了绕过某些限制
              tar -czf ../apk_out/"${ipk%.ipk}.apk" .
              
              cd .. && rm -rf tmp
            fi
          done
          
          # 查看生成的 apk
          ls -l apk_out/

      - name: 7. 上传 APK 到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "lucky-2.19.5-25.12"
          files: sdk/bin/packages/x86_64/apk_out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Lucky APK (SDK 版，无工具链错误)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装基础依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl tar

      - name: 下载 ImmortalWrt 25.12 x86_64 SDK（预编译工具链，直接用）
        run: |
          wget -O openwrt-sdk.tar.xz https://downloads.immortalwrt.org/releases/25.12.0/targets/x86/64/immortalwrt-sdk-25.12.0-x86-64_gcc-14.3.0-musl.Linux-x86_64.tar.xz
          tar -xJf openwrt-sdk.tar.xz
          mv immortalwrt-sdk-* sdk
          cd sdk

      - name: 添加 Lucky 源码（官方路径）
        run: |
          cd sdk
          git clone https://github.com/gdy666/luci-app-lucky.git package/lucky

      - name: 配置编译选项（仅编译 Lucky，不构建工具链）
        run: |
          cd sdk
          cat > .config <<EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_PACKAGE_lucky=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_luci-i18n-lucky-zh-cn=y
          EOF
          make defconfig

      - name: 编译 Lucky（直接用 SDK 自带工具链，不会再报 libgcc 错误）
        run: |
          cd sdk
          make package/lucky/compile -j$(nproc) V=s

      - name: IPK → APK 转换（仅用 tar）
        run: |
          cd sdk/bin/packages/x86_64
          mkdir -p apk_out
          for ipk in *.ipk; do
            mkdir -p tmp && cd tmp
            tar -xzf ../"$ipk"
            tar -xzf ./data.tar.gz -C ./
            tar -czf ../apk_out/"${ipk%.ipk}.apk" .
            cd .. && rm -rf tmp
          done

      - name: 上传 APK 到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "lucky-2.19.5-25.12"
          files: sdk/bin/packages/x86_64/apk_out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

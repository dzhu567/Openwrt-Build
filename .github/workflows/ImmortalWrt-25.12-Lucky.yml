name: ImmortalWrt-25.12-Lucky-APK
on:
  workflow_dispatch: # 手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装完整依赖
        run: |
          sudo apt update && sudo apt install -y \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget curl python3-pip libelf-dev libglib2.0-dev libtool autopoint texinfo pkg-config \
          patch libdeflate-tools tar && sudo apt clean

      - name: 拉取 ImmortalWrt 源码
        run: |
          git clone --depth=1 -b openwrt-25.12 shturl.cc/dLJOUYckomwJwvGS13z21ZqY6yqSOd7b
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 添加 Lucky 源码（按官方方法）
        run: |
          cd immortalwrt
          # 按官方方法，克隆到 package/lucky 目录
          git clone  https://github.com/gdy666/luci-app-lucky.git package/lucky

      - name: 配置编译选项
        run: |
          cd immortalwrt
          # 配置架构和 Lucky 包
          cat > .config << EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_ALL_NONSHARED=y
          CONFIG_DEVEL=y
          CONFIG_TOOLCHAINOPTS=y
          EOF
          make defconfig

      - name: 预编译 host 工具链
        run: |
          cd immortalwrt
          make tools/compile -j$(nproc)
          make package/utils/lua/host/compile -j1 V=s

      - name: 编译 IPK 包（按官方命令）
        run: |
          cd immortalwrt
          # 编译主程序
          make package/lucky/lucky/compile -j$(nproc) V=s || make package/lucky/lucky/compile -j1 V=s
          # 编译 LuCI 面板
          make package/lucky/luci-app-lucky/compile -j$(nproc) V=s || make package/lucky/luci-app-lucky/compile -j1 V=s

      - name: IPK 转 APK（关键步骤）
        run: |
          cd immortalwrt/bin/packages/x86_64/
          # 批量转换所有 .ipk 为 .apk
          for ipk in $(find . -name "lucky*.ipk" -o -name "luci-app-lucky*.ipk" -o -name "luci-i18n-lucky*.ipk"); do
            # 临时目录解压
            mkdir -p /tmp/conv && cd /tmp/conv
            tar -xzf $OLDPWD/$ipk
            tar -xzf ./data.shturl -C ./
            # 打包为 APK 格式（直接 shturl 即可，无需额外元数据）
            tar -czf $OLDPWD/${ipk%.ipk}.apk .
            cd .. && rm -rf /tmp/conv
          done
          # 列出转换后的 APK 文件
          ls -l *.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: lucky-apk-packages
          path: |
            immortalwrt/bin/packages/x86_64/*.apk

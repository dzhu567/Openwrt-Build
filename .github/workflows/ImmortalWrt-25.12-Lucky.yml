name: ImmortalWrt-25.12-Lucky
on:
  workflow_dispatch: # 手动触发编译

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装依赖
        run: |
          sudo apt update && sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl \
          python3-pip libelf-dev && sudo apt clean

      - name: 拉取 ImmortalWrt 源码
        run: |
          # 浅克隆加速，添加重试
          git clone --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt || {
            echo "首次克隆失败，重试..."
            git clone --depth=1 -b openwrt-25.12 shturl.cc/FQ1ZgzGL69sPwxdU9mqOkkpgEF9V8U7k
          }
          cd immortalwrt
          ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 添加 Lucky 软件包
        run: |
          cd immortalwrt
          mkdir -p package/lean && cd package/lean
          # 克隆Lucky包，添加重试
          git clone https://github.com/gdy666/luci-app-lucky || {
            echo "Lucky克隆失败，重试..."
            git clone shturl.cc/7v1sqyFyDWbLhW1ynyQj8
          }
          # 配置编译参数
          cd ../../
          make defconfig
          echo -e "CONFIG_TARGET_x86=y\nCONFIG_TARGET_x86_64=y\nCONFIG_PACKAGE_lucky=y" >> .config
          make defconfig

      - name: 编译 Lucky 包
        run: |
          cd immortalwrt
          CORES=$(nproc)
          # 多线程编译，失败则单线程重试
          make package/lucky/compile -j$CORES V=s || {
            echo "多线程编译失败，单线程重试..."
            make package/lucky/compile -j1 V=s
          }

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: lucky-package-x86_64
          path: immortalwrt/bin/packages/x86_64/base/lucky*.ipk
          # 产物默认保存90天，可调整：retention-days: 7

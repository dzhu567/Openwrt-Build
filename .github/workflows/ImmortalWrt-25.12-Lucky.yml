name: Build Lucky APK (最终版)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl tar zstd

      - name: 2. 下载 SDK
        run: |
          wget -O openwrt-sdk.tar.zst https://downloads.immortalwrt.org/releases/25.12.0-rc2/targets/x86/64/immortalwrt-sdk-25.12.0-rc2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          tar --zstd -xf openwrt-sdk.tar.zst
          mv immortalwrt-sdk-* sdk

      - name: 3. 添加 Lucky
        run: |
          cd sdk
          git clone https://github.com/gdy666/luci-app-lucky.git package/lucky

      - name: 4. 配置编译
        run: |
          cd sdk
          cat > .config << EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_PACKAGE_lucky=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_luci-i18n-lucky-zh-cn=y
          EOF
          make defconfig

      - name: 5. 编译 Lucky
        run: |
          cd sdk
          make package/lucky/compile -j$(nproc) V=s
          echo "===== 编译完成，查找所有 ipk ====="
          find . -name "*.ipk"

      - name: 6. IPK → APK 转换（强制路径）
        run: |
          # 先找到 ipk 的真实路径
          IPK_PATH=$(find sdk -name "*.ipk" | head -n 1)
          echo "找到 ipk: $IPK_PATH"
          
          # 创建输出目录
          mkdir -p apk_out
          
          # 遍历所有 ipk 转换
          find sdk -name "*.ipk" | while read -r ipk; do
            echo "正在转换: $ipk"
            mkdir -p tmp && cd tmp
            tar -xzf "$OLDPWD/$ipk"
            tar -xzf ./data.tar.gz
            tar -czf "$OLDPWD/apk_out/$(basename "$ipk" .ipk).apk" .
            cd .. && rm -rf tmp
          done
          
          echo "===== 转换完成，查看 APK ====="
          ls -l apk_out/

      - name: 7. 上传 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "lucky-2.19.5-25.12"
          files: apk_out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

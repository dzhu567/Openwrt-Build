name: Build Lucky APK (最终无错版)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 安装基础依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl tar zstd

      - name: 2. 下载 SDK
        run: |
          wget -O openwrt-sdk.tar.zst https://downloads.immortalwrt.org/releases/25.12.0-rc2/targets/x86/64/immortalwrt-sdk-25.12.0-rc2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          tar --zstd -xf openwrt-sdk.tar.zst
          mv immortalwrt-sdk-* sdk

      - name: 3. 添加 Lucky
        run: |
          cd sdk
          git clone https://github.com/gdy666/luci-app-lucky.git package/lucky

      - name: 4. 配置编译
        run: |
          cd sdk
          cat > .config << EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_PACKAGE_lucky=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_luci-i18n-lucky-zh-cn=y
          EOF
          make defconfig

      - name: 5. 编译 Lucky
        run: |
          cd sdk
          make package/lucky/compile -j$(nproc) V=s
          echo "===== 编译完成，查看 ipk ====="
          find . -name "*.ipk"

      - name: 6. IPK → APK 转换（固定路径）
        run: |
          # 进入 ipk 所在目录
          cd sdk/bin/packages/x86_64
          
          # 创建 apk_out 目录
          mkdir -p apk_out
          
          # 转换所有 ipk
          for ipk in *.ipk; do
            echo "处理: $ipk"
            mkdir -p tmp && cd tmp
            tar -xzf ../"$ipk"
            tar -xzf ./data.tar.gz
            tar -czf ../apk_out/"${ipk%.ipk}.apk" .
            cd .. && rm -rf tmp
          done
          
          # 关键：检查 APK 是否生成
          echo "===== 转换完成，查看 APK ====="
          ls -l apk_out/
          
          # 复制 APK 到仓库根目录，方便上传
          cp apk_out/*.apk $GITHUB_WORKSPACE/

      - name: 7. 上传 APK 到 Release（路径已修复）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "lucky-2.19.5-25.12"
          files: |
            *.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Lucky APK (SDK 版，带调试)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 1. 安装基础依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl tar zstd

      - name: 2. 下载 SDK
        run: |
          wget -O openwrt-sdk.tar.zst https://downloads.immortalwrt.org/releases/25.12.0-rc2/targets/x86/64/immortalwrt-sdk-25.12.0-rc2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          tar --zstd -xf openwrt-sdk.tar.zst
          mv immortalwrt-sdk-* sdk
          ls -ld sdk

      - name: 3. 添加 Lucky
        run: |
          cd sdk
          git clone https://github.com/gdy666/luci-app-lucky.git package/lucky
          ls -ld package/lucky

      - name: 4. 配置编译
        run: |
          cd sdk
          cat > .config << EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_PACKAGE_lucky=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_luci-i18n-lucky-zh-cn=y
          EOF
          make defconfig

      - name: 5. 编译 Lucky（关键步骤，看日志）
        run: |
          cd sdk
          make package/lucky/compile -j$(nproc) V=s
          # 关键调试：检查是否生成 ipk
          echo "===== 编译完成，查看 ipk ====="
          find bin/packages/x86_64 -name "*.ipk"

      - name: 6. IPK → APK 转换
        run: |
          cd sdk/bin/packages/x86_64
          mkdir -p apk_out
          for ipk in $(find . -name "*.ipk"); do
            echo "处理 $ipk"
            mkdir -p tmp && cd tmp
            tar -xzf ../$ipk
            tar -xzf data.tar.gz
            tar -czf ../apk_out/$(basename $ipk .ipk).apk .
            cd .. && rm -rf tmp
          done
          # 关键调试：检查 apk 是否生成
          echo "===== 转换完成，查看 apk ====="
          ls -ld apk_out/*.apk

      - name: 7. 上传 APK 到 Release（修复路径）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "lucky-2.19.5-25.12"
          files: |
            sdk/bin/packages/x86_64/apk_out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

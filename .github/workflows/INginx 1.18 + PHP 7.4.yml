name: Build Nginx 1.18 + PHP 7.4 for ImmortalWrt x86_64
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装基础依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl tar zstd

      - name: 下载 ImmortalWrt 25.12 SDK
        run: |
          wget -O sdk.tar.zst https://downloads.immortalwrt.org/releases/25.12.0-rc2/targets/x86/64/immortalwrt-sdk-25.12.0-rc2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          tar --zstd -xf sdk.tar.zst
          mv immortalwrt-sdk-* sdk

      - name: 拉取 OpenWrt 21.02 分支源码（含 php7 + nginx 1.18）
        run: |
          cd sdk/package
          # 直接克隆 21.02 分支，这是最后包含 php7 的稳定分支
          git clone --depth 1 --branch openwrt-21.02 https://github.com/openwrt/packages.git openwrt-21.02-packages
          # 复制 nginx 和 php7 到 SDK 的 package 目录
          cp -r openwrt-21.02-packages/net/nginx ./
          cp -r openwrt-21.02-packages/lang/php7 ./
          rm -rf openwrt-21.02-packages

      - name: 锁定 Nginx 版本为 1.18.0
        run: |
          cd sdk/package/nginx
          # 强制修改 Makefile 中的版本号
          sed -i 's/^PKG_VERSION:=.*/PKG_VERSION:=1.18.0/' Makefile
          sed -i 's/^PKG_RELEASE:=.*/PKG_RELEASE:=11/' Makefile

      - name: 配置编译选项
        run: |
          cd sdk
          cat > .config << EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_PACKAGE_nginx=y
          CONFIG_PACKAGE_nginx-ssl=y
          CONFIG_PACKAGE_php7=y
          CONFIG_PACKAGE_php7-fpm=y
          CONFIG_PACKAGE_php7-cli=y
          EOF
          make defconfig

      - name: 编译 Nginx + PHP7
        run: |
          cd sdk
          make package/nginx/compile V=s -j$(nproc)
          make package/php7/compile V=s -j$(nproc)

      - name: 收集 IPK 包
        run: |
          mkdir -p release_assets
          find sdk/bin/x86_64/packages/ -name "nginx*.ipk" -o -name "php7*.ipk" | xargs -I {} cp {} release_assets/

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "nginx-1.18-php7.4-x86_64"
          files: release_assets/*.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
